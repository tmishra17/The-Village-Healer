[project]
name = "finance-manager"
version = "0.1.0"
description = "A Google ADK finance-clerk agent backed by a FastMCP tool server."
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.3.0",
    "fastmcp>=3.4.3",
    "litellm>=1.91.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_manager"]
force-include = { "MCP_Server.py" = "MCP_Server.py" }

[tool.ruff]
line-length = 100
target-version = "py310"
