[project]
name = "village-healer"
version = "0.1.0"
description = "A voice-first AI health-triage assistant (Google ADK + FastMCP) for rural India."
requires-python = ">=3.12"  # Allows any modern Python 3.12+ engine across platforms
dependencies = [
    "google-adk>=2.3.0",
    "fastmcp>=3.4.3",
    "litellm>=1.91.0",      # Keeps your high-performance Qwen3-VL client intact
    "certifi>=2026.6.17",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Village_Healer"]   

# --- THE CRITICAL FIXES FOR PLATFORM-AGNOSTIC UV SYNC ---
[tool.uv]
package = false 
# FIXED: Targets standard native desktop platforms while dropping experimental web targets (emscripten)
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[dependency-groups] 
notebook = [
    "google-cloud-storage>=3.15.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "tabulate>=0.10.0",
    # FIXED: Removed explicit tensorflow pinned wheel requirements from the notebook group.
    # This prevents the solver from crashing on web-assembly/non-x86 platforms.
]
